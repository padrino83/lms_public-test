{% load bootstrap3 %}
{% load i18n %}
<!DOCTYPE html>
<!--[if IE 9 ]><html class="ie9"><![endif]-->
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Page title -->
    <title>{% block title %}{% trans 'Add' %} {{ field }}{% endblock %}</title>

    <!-- Place favicon.ico and apple-touch-icon.png in the root directory -->
    <!--<link rel="shortcut icon" type="image/ico" href="favicon.ico" />-->

    <!-- Vendor styles -->
    <link rel="stylesheet" href="{{ STATIC_URL }}vendor/fontawesome/css/font-awesome.min.css" />
    <link rel="stylesheet" href="{{ STATIC_URL }}vendor/metisMenu/dist/metisMenu.min.css" />
    <link rel="stylesheet" href="{{ STATIC_URL }}vendor/animate.css/animate.min.css" />
    <link rel="stylesheet" href="{{ STATIC_URL }}vendor/bootstrap/dist/css/bootstrap.min.css" />
    {% block extra_css %}{% endblock %}
    <!-- App styles -->
    <link rel="stylesheet" href="{{ STATIC_URL }}fonts/pe-icon-7-stroke/css/pe-icon-7-stroke.css" />
    <link rel="stylesheet" href="{{ STATIC_URL }}fonts/pe-icon-7-stroke/css/helper.css" />
    <link rel="stylesheet" href="{{ STATIC_URL }}styles/style.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ STATIC_URL }}vendor/bootstrap-datepicker-master/dist/css/bootstrap-datepicker3.min.css" />
    <link href="{{ STATIC_URL }}css/chosen.min.css" rel="stylesheet">

</head>

<body>
    <div class="content animate-panel">
        <div class="col-md-12">
            <div class="hpanel hred">
                <div class="panel-heading">
                    <div class="panel-tools">
                        <a class="showhide"><i class="fa fa-chevron-up"></i></a>
                        <a class="closebox"><i class="fa fa-times"></i></a>
                    </div>
                    Agregar {{ field }}
                </div>
                <div class="panel-body">
                    <form enctype="multipart/form-data" method="POST" action="" class="form-horizontal" role="form">
                        {% csrf_token %}
                        <div class="card-body card-padding">                            
                            <div class="col-sm-12">
                            {% bootstrap_form form %}
                            </div>
                            <div class="col-sm-12">
                            {% buttons %}
                                <button type="submit" class="btn btn-success btn-sm btn-block">Guardar</button>
                            {% endbuttons %}
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
  <!-- Javascript Libraries -->
  <script src="{{ STATIC_URL }}js/jquery.min.js"></script>
  <script type="text/javascript" src="{{ STATIC_URL }}js/RelatedObjectLookups.js"></script>
</body>
</html>
